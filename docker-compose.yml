version: '3.8'

services:
  # Database untuk Wisata Service (Python/FastAPI)
  postgres-wisata:
    image: postgis/postgis:15-3.3
    container_name: jogja-postgres
    environment:
      POSTGRES_USER: wisata_user
      POSTGRES_PASSWORD: wisata_password
      POSTGRES_DB: wisata_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Database untuk Rental Service (Node.js/Express)
  mongo-rental:
    image: mongo:6
    container_name: jogja-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: rental_admin
      MONGO_INITDB_ROOT_PASSWORD: rental_password
      MONGO_INITDB_DATABASE: rental_db
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  # Database untuk Kuliner Service (Go)
  mysql-kuliner:
    image: mysql:8
    container_name: jogja-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: kuliner_db
      MYSQL_USER: kuliner_user
      MYSQL_PASSWORD: kuliner_password
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    restart: unless-stopped

  # Message Broker untuk sinkronisasi asinkron
  rabbitmq:
    image: rabbitmq:3-management
    container_name: jogja-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: jogja_user
      RABBITMQ_DEFAULT_PASS: jogja_password
    ports:
      - "5672:5672" # Port AMQP
      - "15672:15672" # Port Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  mysqldata:
  rabbitmqdata:
